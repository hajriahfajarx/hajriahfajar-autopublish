name: Daily auto-publish

# Instead of sleeping inside the runner (which burns billable Actions
# minutes for nothing), there are several fixed cron triggers spread across
# the publish window. A dependency-free pre-check (scripts/check-slot.mjs)
# runs first and picks exactly one of them per day via a deterministic hash
# of today's date — every other trigger exits in a couple of seconds without
# installing anything. See scripts/check-slot.mjs for the slot map; it must
# stay in sync with the cron entries below.
on:
  schedule:
    - cron: "0 12 * * *" # 19:00 WIB — slot 0
    - cron: "15 12 * * *" # 19:15 WIB — slot 1
    - cron: "30 12 * * *" # 19:30 WIB — slot 2
    - cron: "45 12 * * *" # 19:45 WIB — slot 3
    - cron: "0 13 * * *" # 20:00 WIB — slot 4
    - cron: "15 13 * * *" # 20:15 WIB — slot 5
  workflow_dispatch: {}

jobs:
  check-slot:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
        run: node scripts/check-slot.mjs

  publish:
    needs: check-slot
    if: needs.check-slot.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run daily article pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PUBLISH_WINDOW_START: ${{ secrets.PUBLISH_WINDOW_START }}
          PUBLISH_WINDOW_END: ${{ secrets.PUBLISH_WINDOW_END }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
          ACTIVE_CATEGORIES: ${{ secrets.ACTIVE_CATEGORIES }}
        run: npm run run
