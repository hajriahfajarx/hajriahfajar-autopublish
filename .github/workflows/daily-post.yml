name: Daily auto-publish

# Instead of sleeping inside the runner (which burns billable Actions
# minutes for nothing), there are several fixed cron triggers spread across
# 2 daily windows (morning/evening). A dependency-free pre-check
# (scripts/check-slot.mjs) runs first and picks exactly one slot per window
# per day via a deterministic hash of today's date + window name — every
# other trigger exits in a couple of seconds without installing anything.
# See scripts/check-slot.mjs for the slot map; it must stay in sync with the
# cron entries below.
on:
  schedule:
    # Morning window, COMPENSATED: configured 20:00-22:30 UTC (prev. UTC
    # day) for a real-world landing around 07:00-09:30 WIB. GitHub was
    # observed delivering this account's scheduled triggers ~3-4.5h late
    # (likely queuing congestion on the common :00/:15/:30/:45 marks), so
    # this is shifted earlier + uses uncommon minute offsets. Re-tune if the
    # delay pattern changes. Trending tech news (Google Search grounded),
    # forced to the Digital Insights category regardless of
    # ACTIVE_CATEGORIES. See pickTrendingTopic in src/gemini.mjs.
    - cron: "7 20 * * *"
    - cron: "22 20 * * *"
    - cron: "37 20 * * *"
    - cron: "52 20 * * *"
    - cron: "7 21 * * *"
    - cron: "22 21 * * *"
    - cron: "37 21 * * *"
    - cron: "52 21 * * *"
    - cron: "7 22 * * *"
    - cron: "22 22 * * *"
    # Evening window, COMPENSATED: configured 08:00-09:30 UTC for a
    # real-world landing around 19:00-20:30 WIB. Normal category rotation.
    - cron: "7 8 * * *"
    - cron: "22 8 * * *"
    - cron: "37 8 * * *"
    - cron: "52 8 * * *"
    - cron: "7 9 * * *"
    - cron: "22 9 * * *"
  workflow_dispatch: {}

jobs:
  check-slot:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      window: ${{ steps.check.outputs.window }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
        run: node scripts/check-slot.mjs

  publish:
    needs: check-slot
    if: needs.check-slot.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run daily article pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PUBLISH_WINDOW_ID: ${{ needs.check-slot.outputs.window }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
          ACTIVE_CATEGORIES: ${{ secrets.ACTIVE_CATEGORIES }}
        run: npm run run
